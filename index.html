<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Train</title>
<link rel="preconnect" href="https://wkbtiaamzsgvtmwjdxql.supabase.co" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<style>
  :root {
    --bg: #fbf7f2; --card: #ffffff; --ink: #2b2420; --muted: #7a6d64; --line: #ece4da;
    --accent: #c8553d; --accent-ink: #fff; --open: #f3ece3; --mine: #fff4e8; --taken: #eef5ee; --taken-ink: #3e6b46;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --card: #262220; --ink: #f2ece6; --muted: #a8998d; --line: #3a3330;
      --accent: #e07a5f; --accent-ink: #1c1917; --open: #2e2926; --mine: #3a2c22; --taken: #23302a; --taken-ink: #9ccaa6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.75rem; margin: 0 0 16px; line-height: 1.2; }
  .sub { color: var(--muted); margin: 0 0 16px; white-space: pre-wrap; }
  .info { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 24px; }
  .info div { padding: 4px 0; }
  .info .msg { white-space: pre-wrap; padding: 4px 0 12px; }
  .info .msg:not(:last-child) { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .info b { display: inline-block; min-width: 92px; color: var(--muted); font-weight: 500; }
  .info:empty { display: none; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  .day { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .day.mine { background: var(--mine); border-color: var(--accent); }
  .date { width: 52px; text-align: center; flex: none; }
  .date .dow { font-size: .75rem; text-transform: uppercase; color: var(--muted); }
  .date .dnum { font-size: 1.4rem; font-weight: 600; line-height: 1.1; }
  .body { flex: 1; min-width: 0; }
  .body .who { font-weight: 600; }
  .body .what { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  .open-label { color: var(--muted); }
  .pill { font-size: .75rem; background: var(--taken); color: var(--taken-ink); border-radius: 99px; padding: 2px 8px; margin-left: 6px; font-weight: 500; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--open); color: var(--ink); padding: 8px 14px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  .day.past { opacity: .55; }
  #status { text-align: center; color: var(--muted); padding: 40px 0; }
  dialog { border: none; border-radius: 16px; padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  form { padding: 20px; }
  form h3 { margin: 0 0 16px; }
  label { display: block; font-size: .9rem; font-weight: 500; margin: 12px 0 4px; }
  label small { color: var(--muted); font-weight: 400; }
  input, textarea, select { width: 100%; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
  .actions .danger { margin-right: auto; color: var(--accent); background: none; border-color: transparent; padding-left: 0; }
  .err { color: var(--accent); font-size: .9rem; margin-top: 12px; }
  .done p { margin: 0 0 12px; }
  .org-link { text-align: right; margin: -16px 0 8px; }
  .org-link button, .toggle button { background: none; border: none; color: var(--muted); padding: 0; text-decoration: underline; font-size: .85rem; }
  .row2 { display: flex; gap: 8px; } .row2 > div { flex: 1; min-width: 0; }
  .days { display: flex; flex-wrap: wrap; gap: 6px; }
  .days label { display: flex; align-items: center; gap: 4px; margin: 0; font-weight: 400; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .days input { width: auto; }
  .toggle { margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1 id="title">Meal Train</h1>
  <div class="info" id="info"></div>
  <div class="org-link"><button type="button" id="org-open">Organizer? Edit details</button></div>
  <div id="list"><div id="status">Loading…</div></div>
  <div class="toggle" id="past-toggle" hidden><button type="button">Show past days</button></div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="form-title">Sign up</h3>
    <label for="f-date">Day</label>
    <select id="f-date" required></select>
    <label for="f-name">Your name</label>
    <input id="f-name" required maxlength="100" autocomplete="name">
    <label for="f-email">Email <small>(only the organizer sees this; you'll use it to edit later)</small></label>
    <input id="f-email" type="email" required maxlength="200" autocomplete="email">
    <label for="f-phone">Phone <small>(only the organizer sees this)</small></label>
    <input id="f-phone" type="tel" required maxlength="50" autocomplete="tel">
    <label for="f-meal">What you're bringing <small>(optional)</small></label>
    <input id="f-meal" maxlength="300" placeholder="e.g. Lasagna and a salad">
    <label for="f-notes">Notes <small>(optional)</small></label>
    <textarea id="f-notes" maxlength="1000"></textarea>
    <div class="err" id="f-err" hidden></div>
    <div class="actions">
      <button type="button" class="danger" id="f-delete" hidden>Cancel my signup</button>
      <button type="button" class="close">Close</button>
      <button type="submit" class="primary" id="f-submit">Sign up</button>
    </div>
  </form>
  <form class="done" id="done" method="dialog" hidden>
    <h3>Thank you! 💛</h3>
    <p id="done-msg"></p>
    <p>Need to change something later? Tap <b>Edit</b> on your day. On a different phone or computer, it'll just ask for your email.</p>
    <div class="actions"><button class="primary">Done</button></div>
  </form>
  <form id="claim" hidden>
    <h3>Edit this signup</h3>
    <p class="sub" id="claim-msg"></p>
    <label for="c-email">Email you signed up with</label>
    <input id="c-email" type="email" required maxlength="200" autocomplete="email">
    <div class="err" id="c-err" hidden></div>
    <div class="actions">
      <button type="button" class="close">Close</button>
      <button type="submit" class="primary" id="c-submit">Continue</button>
    </div>
  </form>
  <form id="org-login" hidden>
    <h3>Organizer login</h3>
    <label for="o-login-email">Organizer email</label>
    <input id="o-login-email" type="email" required maxlength="200" autocomplete="email">
    <div class="err" id="o-login-err" hidden></div>
    <div class="actions">
      <button type="button" class="close">Close</button>
      <button type="submit" class="primary">Continue</button>
    </div>
  </form>
  <form id="org-form" hidden>
    <h3>Edit meal train details</h3>
    <label for="o-headline">Title</label>
    <input id="o-headline" maxlength="120" required>
    <label for="o-message">Message <small>(shown at the top of the details box)</small></label>
    <textarea id="o-message" maxlength="2000"></textarea>
    <label for="o-address">Drop-off address</label>
    <input id="o-address" maxlength="300">
    <label for="o-dropoff">Drop-off time</label>
    <input id="o-dropoff" maxlength="100" placeholder="e.g. 5:00 – 6:00 pm">
    <label for="o-dietary">Dietary notes</label>
    <textarea id="o-dietary" maxlength="1000" placeholder="Allergies, likes, dislikes"></textarea>
    <div class="row2">
      <div><label for="o-start">First meal</label><input id="o-start" type="date" required></div>
      <div><label for="o-end">Last meal</label><input id="o-end" type="date" required></div>
    </div>
    <label>Meal days</label>
    <div class="days" id="o-days"></div>
    <div class="err" id="o-err" hidden></div>
    <div class="actions">
      <button type="button" class="close">Close</button>
      <button type="submit" class="primary" id="o-submit">Save</button>
    </div>
  </form>
</dialog>

<script>
// Publishable (anon) key: safe to ship in the browser. The database only allows
// reading the schedule and writing through token-checked functions.
const SUPABASE_URL = 'https://wkbtiaamzsgvtmwjdxql.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrYnRpYWFtenNndnRtd2pkeHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDg4ODUsImV4cCI6MjEwNzU4NDg4NX0.rYyDTbzyKjqmNr3fgQhJljgxU65M5ec1a49lqFP7Gs0';

const $ = id => document.getElementById(id);
const TOKENS_KEY = 'mealtrain-tokens';
let state = { settings: null, signups: [] };
let editing = null; // { id, token } when editing
let showPast = false;

function getTokens() { try { return JSON.parse(localStorage.getItem(TOKENS_KEY)) || {}; } catch { return {}; } }
function saveToken(id, token) { try { const t = getTokens(); t[id] = token; localStorage.setItem(TOKENS_KEY, JSON.stringify(t)); } catch {} }
function dropToken(id) { try { const t = getTokens(); delete t[id]; localStorage.setItem(TOKENS_KEY, JSON.stringify(t)); } catch {} }

async function rpc(fn, args = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(body?.message || 'Something went wrong. Please try again.');
  return body;
}

// Dates are handled as local 'YYYY-MM-DD' strings to avoid timezone shifts.
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayIso = () => iso(new Date());
const fmtLong = s => parse(s).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

function mealDays() {
  const s = state.settings, out = [];
  for (let d = parse(s.start_date); iso(d) <= s.end_date; d.setDate(d.getDate() + 1)) {
    if (s.meal_days.includes(d.getDay())) out.push(iso(d));
  }
  return out;
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === 'class' ? e.className = v : k.startsWith('on') ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k);
  return e;
}

function render() {
  const s = state.settings;
  document.title = s.headline;
  $('title').textContent = s.headline;
  const info = $('info'); info.replaceChildren();
  if (s.message) info.append(el('div', { class: 'msg' }, s.message));
  for (const [label, val] of [['Drop-off', s.dropoff_window], ['Address', s.address], ['Dietary', s.dietary_notes]]) {
    if (val) info.append(el('div', {}, el('b', {}, label), val));
  }

  const bySignup = Object.fromEntries(state.signups.map(x => [x.meal_date, x]));
  const tokens = getTokens(), today = todayIso();
  const days = mealDays();
  const hasPast = days.some(d => d < today);
  $('past-toggle').hidden = !hasPast;
  $('past-toggle').querySelector('button').textContent = showPast ? 'Hide past days' : 'Show past days';

  const list = $('list'); list.replaceChildren();
  let month = '';
  for (const d of days) {
    const past = d < today;
    if (past && !showPast) continue;
    const date = parse(d);
    const m = date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    if (m !== month) { list.append(el('h2', {}, m)); month = m; }
    const sig = bySignup[d];
    const mine = sig && tokens[sig.id];
    const body = sig
      ? el('div', { class: 'body' },
          el('div', { class: 'who' }, sig.name, mine ? el('span', { class: 'pill' }, 'You') : null),
          sig.meal ? el('div', { class: 'what' }, sig.meal) : null)
      : el('div', { class: 'body' }, el('span', { class: 'open-label' }, 'Open'));
    const btn = past ? null
      : mine ? el('button', { onclick: () => openEdit(sig.id, tokens[sig.id]) }, 'Edit')
      : sig ? el('button', { onclick: () => openClaim(sig) }, 'Edit')
      : el('button', { class: 'primary', onclick: () => openNew(d) }, 'Sign up');
    list.append(el('div', { class: `day${mine ? ' mine' : ''}${past ? ' past' : ''}` },
      el('div', { class: 'date' },
        el('div', { class: 'dow' }, date.toLocaleDateString(undefined, { weekday: 'short' })),
        el('div', { class: 'dnum' }, date.getDate())),
      body, btn));
  }
  if (!list.children.length) list.append(el('div', { id: 'status' }, 'No upcoming meal days.'));
}

function fillDates(selected, allowTaken) {
  const taken = new Set(state.signups.filter(x => x.meal_date !== allowTaken).map(x => x.meal_date));
  const today = todayIso();
  $('f-date').replaceChildren(...mealDays().filter(d => d >= today && !taken.has(d))
    .map(d => { const o = el('option', { value: d }, fmtLong(d)); if (d === selected) o.selected = true; return o; }));
}

function showForm() {
  showPanel('form'); $('f-err').hidden = true;
  $('f-submit').disabled = false;
}

// The dialog holds several forms; show one at a time.
function showPanel(id) {
  for (const f of $('dlg').querySelectorAll('form')) f.hidden = f.id !== id;
  if (!$('dlg').open) $('dlg').showModal();
}
for (const b of $('dlg').querySelectorAll('.close')) b.addEventListener('click', () => $('dlg').close());

function openNew(date) {
  editing = null;
  fillDates(date);
  $('form-title').textContent = 'Sign up for a meal';
  $('f-submit').textContent = 'Sign up';
  $('f-delete').hidden = true;
  // Prefill from last time to save typing.
  let last = {}; try { last = JSON.parse(localStorage.getItem('mealtrain-me')) || {}; } catch {}
  $('f-name').value = last.name || ''; $('f-email').value = last.email || ''; $('f-phone').value = last.phone || '';
  $('f-meal').value = ''; $('f-notes').value = '';
  showForm();
}

async function openEdit(id, token) {
  try {
    const [row] = await rpc('get_my_signup', { p_id: id, p_token: token });
    if (!row) { dropToken(id); render(); alert("We couldn't find that signup. It may have been removed."); return; }
    editing = { id, token };
    fillDates(row.meal_date, row.meal_date);
    $('form-title').textContent = 'Edit your signup';
    $('f-submit').textContent = 'Save changes';
    $('f-delete').hidden = false;
    $('f-name').value = row.name; $('f-email').value = row.email; $('f-phone').value = row.phone;
    $('f-meal').value = row.meal; $('f-notes').value = row.notes;
    showForm();
  } catch (e) { alert(e.message); }
}

function fail(e) { $('f-err').textContent = e.message; $('f-err').hidden = false; $('f-submit').disabled = false; }

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('f-submit').disabled = true; $('f-err').hidden = true;
  const args = { p_date: $('f-date').value, p_name: $('f-name').value, p_email: $('f-email').value, p_phone: $('f-phone').value,
    p_meal: $('f-meal').value, p_notes: $('f-notes').value };
  try { localStorage.setItem('mealtrain-me', JSON.stringify({ name: args.p_name, email: args.p_email, phone: args.p_phone })); } catch {}
  try {
    if (editing) {
      await rpc('update_signup', { p_id: editing.id, p_token: editing.token, ...args });
      $('dlg').close();
    } else {
      const [{ id, edit_token }] = await rpc('create_signup', args);
      saveToken(id, edit_token);
      $('done-msg').textContent = `You're signed up for ${fmtLong(args.p_date)}.`;
      showPanel('done');
    }
  } catch (e) { fail(e); }
  load();
});

$('f-delete').addEventListener('click', async () => {
  if (!confirm('Cancel your signup for this day?')) return;
  try { await rpc('delete_signup', { p_id: editing.id, p_token: editing.token }); dropToken(editing.id); $('dlg').close(); load(); }
  catch (e) { fail(e); }
});

// Editing from a new device: prove it's you with the email you signed up with.
let claiming = null;
function openClaim(sig) {
  claiming = sig;
  $('claim-msg').textContent = `${sig.name} · ${fmtLong(sig.meal_date)}`;
  let last = {}; try { last = JSON.parse(localStorage.getItem('mealtrain-me')) || {}; } catch {}
  $('c-email').value = last.email || '';
  $('c-err').hidden = true; $('c-submit').disabled = false;
  showPanel('claim');
  $('c-email').focus();
}
$('claim').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('c-submit').disabled = true; $('c-err').hidden = true;
  try {
    const res = await rpc('claim_signup', { p_id: claiming.id, p_email: $('c-email').value });
    if (res.error) throw new Error(res.error);
    saveToken(claiming.id, res.token);
    render();
    await openEdit(claiming.id, res.token);
  } catch (e) { $('c-err').textContent = e.message; $('c-err').hidden = false; $('c-submit').disabled = false; }
});
// Organizer: edit the details at the top of the page.
const ORG_KEY = 'mealtrain-organizer';
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
let orgEmail = null;
$('org-open').addEventListener('click', async () => {
  let saved = null; try { saved = localStorage.getItem(ORG_KEY); } catch {}
  if (saved && await rpc('is_organizer', { p_email: saved }).catch(() => false)) return openOrgForm(saved);
  $('o-login-email').value = ''; $('o-login-err').hidden = true;
  showPanel('org-login');
});
$('org-login').addEventListener('submit', async ev => {
  ev.preventDefault();
  const email = $('o-login-email').value;
  try {
    if (!await rpc('is_organizer', { p_email: email })) throw new Error("That isn't the organizer email");
    try { localStorage.setItem(ORG_KEY, email); } catch {}
    openOrgForm(email);
  } catch (e) { $('o-login-err').textContent = e.message; $('o-login-err').hidden = false; }
});
function openOrgForm(email) {
  orgEmail = email;
  const s = state.settings;
  $('o-headline').value = s.headline; $('o-message').value = s.message; $('o-address').value = s.address;
  $('o-dropoff').value = s.dropoff_window; $('o-dietary').value = s.dietary_notes;
  $('o-start').value = s.start_date; $('o-end').value = s.end_date;
  $('o-days').replaceChildren(...DAY_NAMES.map((n, i) => {
    const cb = el('input', { type: 'checkbox', value: i }); cb.checked = s.meal_days.includes(i);
    return el('label', {}, cb, n);
  }));
  $('o-err').hidden = true; $('o-submit').disabled = false;
  showPanel('org-form');
}
$('org-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('o-submit').disabled = true; $('o-err').hidden = true;
  try {
    await rpc('update_settings', {
      p_email: orgEmail, p_headline: $('o-headline').value, p_message: $('o-message').value,
      p_address: $('o-address').value, p_dropoff_window: $('o-dropoff').value, p_dietary_notes: $('o-dietary').value,
      p_start_date: $('o-start').value, p_end_date: $('o-end').value,
      p_meal_days: [...$('o-days').querySelectorAll('input:checked')].map(c => Number(c.value)),
    });
    $('dlg').close();
    load();
  } catch (e) { $('o-err').textContent = e.message; $('o-err').hidden = false; $('o-submit').disabled = false; }
});

$('past-toggle').addEventListener('click', () => { showPast = !showPast; render(); });

async function load() {
  try {
    state = await rpc('get_schedule');
    render();
  } catch (e) {
    $('list').replaceChildren(el('div', { id: 'status' }, "Couldn't load the schedule. Please refresh."));
  }
}

// Edit links look like #edit=<id>.<token>; remember the token on this device.
function takeEditLink() {
  const m = location.hash.match(/^#edit=([0-9a-f-]{36})\.([0-9a-f-]{36})$/);
  if (!m) return null;
  saveToken(m[1], m[2]);
  history.replaceState(null, '', location.pathname);
  return { id: m[1], token: m[2] };
}
window.addEventListener('hashchange', () => {
  const link = takeEditLink();
  if (link) { if (state.settings) render(); openEdit(link.id, link.token); }
});
const link = takeEditLink();
load().then(() => { if (link) openEdit(link.id, link.token); });
</script>
</body>
</html>
